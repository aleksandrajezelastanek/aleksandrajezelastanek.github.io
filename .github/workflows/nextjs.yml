# Builds the static site and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL   canonical origin, e.g. https://jezela-stanek.pl  (custom domain)
#              Leave unset to use the default https://<user>.github.io/<repo>.
#   ENABLE_EN  "1" to publish the English version (only after translations are approved).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - name: Resolve deployment URLs
        id: urls
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            # Custom domain: served from the root.
            echo "site_url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            # Default project site: https://<user>.github.io/<repo>
            echo "site_url=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "base_path=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Type check, lint, content check, unit tests
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
          NEXT_PUBLIC_ENABLE_EN: ${{ vars.ENABLE_EN }}
          CHECK_DEPLOY: "1"
        run: |
          npm run typecheck
          npm run lint
          npm run check:content
          npm test

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.urls.outputs.base_path }}
          NEXT_PUBLIC_ENABLE_EN: ${{ vars.ENABLE_EN }}
        run: npm run build

      - name: Verify static output
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
          NEXT_PUBLIC_ENABLE_EN: ${{ vars.ENABLE_EN }}
        run: npm run test:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
